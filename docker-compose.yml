version: '3.8'
services:
  minio:
    image: minio/minio
    container_name: minio_server
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data
  mongo:
    image: mongo:latest
    container_name: mongo_server
    ports:
      - "27017:27017"
    volumes:
      - ./mongo_data:/data/db